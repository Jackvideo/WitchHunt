services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-witchhunt}
      MYSQL_USER: ${DB_USER:-witchhunt}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      GIN_MODE: release
      SERVER_PORT: "8080"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: ${DB_USER:-witchhunt}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-witchhunt}
      JWT_SECRET: ${JWT_SECRET}
    expose:
      - "8080"

  frontend:
    build: ./web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HOST_PORT:-80}:80"

volumes:
  mysql_data:
